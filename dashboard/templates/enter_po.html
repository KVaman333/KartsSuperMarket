{% extends 'base.html' %}
{% load static %}


{% block main %}


<section class="ftco-section-parallax">
   <div class="parallax-img d-flex align-items-center">
      <div class="container">
         <div class="row d-flex justify-content-center py-5">
            <div class="col-md-7 text-center heading-section ftco-animate">
               <h1 class="big">PO Number</h1>
               <h2>Enter P.O. Number</h2>
               <div class="row d-flex justify-content-center mt-5">
                  <div class="col-md-8">
                     <form action="." method="POST" class="subscribe-form"> {% csrf_token %}
                        <div class="form-group d-flex">
                           <input name="po_num" type="text" class="form-control" placeholder="Purchase Order Number">
                           <input type="submit" value="Search" class="submit px-3" required>
                        </div>
                        {% if no_details %}
                        <p>Please Enter Purchase Order Number</p>
                        {% endif %}
                     </form>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</section> 


{% endblock main %}
