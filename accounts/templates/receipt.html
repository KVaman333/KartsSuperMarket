{% extends 'base.html' %}
{% load static %}


{% block main %}

<section class="ftco-section">
   <div class="container">
      <div class="row justify-content-center">
         <div class="col-xl-8 ftco-animate">
            <form action="." enctype="multipart/form-data" class=" billing-form bg-light p-3 p-md-5" method="POST" > {% csrf_token %}
               <h3 class="mb-4 billing-heading">Receipts&nbsp;<u>{{po_num}}</u></h3>
               <div class="row align-items-end">
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Receipt Of</label>
                        <input name="name" type="text" class="form-control" placeholder="Receipt" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Amount</label>
                        <input name="amount" type="number" step="0.01" placeholder="$" class="form-control" required>
                     </div>
                  </div>
                  <div class="w-100"></div>
                  <div class="col-md-12">
                     <div class="form-group">
                        <label for="event">Payment Method</label>
                        <div class="select-wrap">
                           <div class="icon"><span class="fas fa-sort-down"></span></div>
                           <select name="pay" id="event" class="form-control">
                              <option value="Cash"          >Cash</option>
                              <option value="Credit Card"   >Credit Card</option>
                              <option value="Online Payment">Online Payment</option>
                              <option value="Cheque"         >Cheque</option>
                           </select>
                        </div>
                     </div>
                  </div>
                  <div class="w-100"></div>
                  {% comment %} <div class="col-md-12">
                  <label for="event">Receipt</label>
                     <label for="file-upload" class="form-control custom-file-upload">
                        <i class="fa fa-cloud-upload fa-1x"></i>&nbsp;&nbsp;Upload Original Document
                     </label>
                     <input id="file-upload" type="file"/>
                  </div> {% endcomment %}
                  <div class="w-100"></div>
                  <div class="col-md-12">
                  <label for="event">Receipt</label>
                     <input name="file" class="upload-box" accept=".jpg,.jpeg,.pdf" type="file"/>
                  </div>
                  <div class="w-100"></div>
                  <br>
                  <div class="col-md-12">
                     <div class="form-group d-flex">
                        <input name="remarks" type="text" class="form-control" placeholder="Remarks" required>
                        <input type="submit" value="Submit" class="submit px-3">
                     </div>
                     <div class="text-center">
                     {% if invalid_details %}
                     <p>Incomplete Entry Details</p>
                     {% endif %}
                     </div>
                  </div>
               </div>
            </form>
            <p class="text-center"><b>For merging pdf we recommend <a href="https://www.ilovepdf.com/merge_pdf" target="_blank"><u>IlovePDF</u></a></b></p>
         </div>
      </div>
   </div>
</section>

{% endblock main %}
