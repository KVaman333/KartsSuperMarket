{% extends 'base.html' %}
{% load static %}


{% block main %}

<section class="ftco-section">
    <div class="container">
      <div class="row justify-content-center">
         <div id="rcorners2" class="col-xl-8 ftco-animate">
            <form action="." enctype="multipart/form-data" class=" billing-form bg-light p-3 p-md-5" method="POST" > {% csrf_token %}
               <h3 class="mb-4 billing-heading">Petty Cash&nbsp;<u>{{po_num}}</u></h3>
               <div class="row align-items-end">
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Amount</label>
                        <input name="amount" type="number" step="0.01" placeholder="$" class="form-control" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Charge Account</label>
                        <input name="account" type="text" class="form-control" placeholder="Charge Account" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Paid To</label>
                        <input name="to" type="text" class="form-control" placeholder="To" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Paid By</label>
                        <input name="by" type="text" value="{{request.COOKIES.user|capfirst}}" class="form-control" placeholder="By" required>
                     </div>
                  </div>
                  <div class="col-md-12">
                     <div class="form-group d-flex">
                        <input name="remarks" type="text" class="form-control" placeholder="Remarks" required>
                        <input type="submit" value="Submit" class="submit px-3">
                     </div>
                     <div class="text-center">
                     {% if invalid_details %}
                     <p>Incomplete Entry Details</p>
                     {% endif %}
                     </div>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</section>

{% endblock main %}
