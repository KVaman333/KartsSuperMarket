{% extends 'base.html' %}
{% load static %}
{% load base_tags %}

{% block main %}

<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <h2>PETTY CASH</h2>
    </div>
    <!-- Multi Column -->
    <div class="row clearfix">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>
              CASH PAID DETAILS
            </h2>
          </div>
          <form action="." method="POST"> {% csrf_token %}
            <div class="body">
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="amount" min='0.01' type="number"  step="0.01" class="form-control" required/>
                        <label class="form-label">$ Amount</label>
                      </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="account" type="text" class="form-control" required/>
                        <label class="form-label">Charged To Account</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="to" type="text" class="form-control" required/>
                        <label class="form-label">Paid To</label>
                      </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="by" type="text" value="{{request.COOKIES.user|name|capfirst}}" class="form-control" required/>
                        <label class="form-label">Paid By</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-12">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="remarks" name="remarks" type="text" class="form-control" required/>
                        <label class="form-label">Details</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-sm-9"></div>
                <div class="col-sm-3" style="padding-left: 13%">
                  <button type="submit" class="btn bg-green btn-lg m-l-15 waves-effect">CONFIRM</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- #END# Multi Column -->
  </div>
</section>

{% endblock main %}
