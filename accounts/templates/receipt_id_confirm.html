{% extends 'base.html' %}
{% load static %}


{% block main %}

<section class="ftco-section">
   <div class="container">
      <div class="row justify-content-center">
         <div class="col-xl-8 ftco-animate">
            <form action="." class="billing-form bg-light p-3 p-md-5" method="POST" > {% csrf_token %}
                <h3 class="mb-4 billing-heading">Receipt ID</h3>
                <div class="row align-items-end">
                  <div class="col-md-12">
                     <div class="form-group d-flex">
                        <input name="remarks" type="text" class="form-control" placeholder="{{id}}" disabled>
                        <input type="submit" value="NEXT" class="submit px-3">
                     </div>
                  </div>
                </div>
                <div class="text-center">
                <p>Please Note Receipt ID on the Original Document</p>
                <p>And Press Next</p>
                </div>
            </form>
         </div>
      </div>
   </div>
</section>


{% endblock main %}
