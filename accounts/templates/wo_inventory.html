{% extends 'base.html' %}
{% load static %}


{% block main %}

<section class="ftco-section">
   <div class="container">
      <div class="row justify-content-center">
         <div class="col-xl-8 ftco-animate">
            <form action="." class="billing-form bg-light p-3 p-md-5" method="POST" > {% csrf_token %}
               <h3 class="mb-4 billing-heading">Inventory&nbsp; Write-Off<u>{{po_num}}</u></h3>
               <div class="row align-items-end">
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Name of Item</label>
                        <input name="name" type="text" class="form-control" placeholder="Item" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">UPC Code</label>
                        <input name="upc" type="text" class="form-control" placeholder="UPC" required>
                     </div>
                  </div>
                  <div class="w-100"></div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="event">Event of Notice</label>
                        <div class="select-wrap">
                           <div class="icon"><span class="fas fa-sort-down"></span></div>
                           <select name="event" id="event" class="form-control">
                              <option value="Used"    >Used</option>
                              <option value="Breakage">Breakage</option>
                              <option value="Damaged" >Damaged</option>
                              <option value="Missing" >Missing</option>
                              <option value="Tampered">Tampered (Enter Event In Remarks)</option>
                           </select>
                        </div>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Number">Pack Size</label>
                        <input name="size" type="text" class="form-control" placeholder="Pack Size" required>
                     </div>
                  </div>
                  <div class="w-100"></div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Amount">Quantity</label>
                        <input name="quantity" type="text" class="form-control" placeholder="Number of Pieces" required>
                     </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="Invoice Amount">Price/Per Unit</label>
                        <input name="prize" type="number" step="0.01" class="form-control" placeholder="Price" required>
                     </div>
                  </div>
                  <div class="w-100"></div>
                  <div class="col-md-12">
                     <div class="form-group d-flex">
                        <input name="remarks" type="text" class="form-control" placeholder="Remarks" required>
                        <input type="submit" value="Submit" class="submit px-3">
                     </div>
                     <div class="text-center">
                     {% if invalid_details %}
                     <p>Incomplete Entry Details</p>
                     {% endif %}
                     </div>
                  </div>
               </div>
            </form>
         </div>
      </div>
   </div>
</section>


{% endblock main %}
