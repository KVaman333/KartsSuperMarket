{% extends 'base.html' %}
{% load static %}


{% block css %}
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=latin,cyrillic-ext" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" type="text/css">

  <!-- Bootstrap Core Css -->
  <link href="{% static 'plugins/bootstrap/css/bootstrap.css' %}" rel="stylesheet">

  <!-- Waves Effect Css -->
  <link href="{% static 'plugins/node-waves/waves.css' %}" rel="stylesheet" />

  <!-- Animation Css -->
  <link href="{% static 'plugins/animate-css/animate.css' %}" rel="stylesheet" />

  <!-- Bootstrap Material Datetime Picker Css -->
  <link href="{% static 'plugins/bootstrap-material-datetimepicker/css/bootstrap-material-datetimepicker.css' %}" rel="stylesheet" />

  <!-- Bootstrap DatePicker Css -->
  <link href="{% static 'plugins/bootstrap-datepicker/css/bootstrap-datepicker.css' %}" rel="stylesheet" />

  <!-- Wait Me Css -->
  <link href="{% static 'plugins/waitme/waitMe.css' %}" rel="stylesheet" />

  <!-- Bootstrap Select Css -->
  <link href="{% static 'plugins/bootstrap-select/css/bootstrap-select.css' %}" rel="stylesheet" />

  <!-- Sweetalert Css -->
  <link href="{% static 'plugins/sweetalert/sweetalert.css' %}" rel="stylesheet" />

  <!-- Custom Css -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet">

  <!-- AdminBSB Themes. You can choose a theme from css/themes instead of get all themes -->
  <link href="{% static 'css/themes/all-themes.css' %}" rel="stylesheet" />
{% endblock css %}


{% block main %}

<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <h2>INVENTORY WRITE-OFF</h2>
    </div>
    <!-- Multi Column -->
    <div class="row clearfix">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>
              ITEM DETAILS
            </h2>
          </div>
          <form action="." method="POST"> {% csrf_token %}
            <div class="body">
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="name" type="text" class="form-control" required>
                        <label class="form-label">Name Of Item</label>
                      </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="upc" type="text" class="form-control" required>
                        <label class="form-label">UPC Code</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <select name="event" class="form-control show-tick" required>
                    <option value="">-- Please select --</option>
                    <option value="Used">Used</option>
                    <option value="Expired">Expired</option>
                    <option value="Breakage">Breakage</option>
                    <option value="Damaged">Damaged</option>
                    <option value="Missing">Missing</option>
                    <option value="Tampered">Tampered (Enter Event In Remarks)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="size" type="text" class="form-control" required>
                        <label class="form-label">Pack Size</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="quantity" min='1' type="number" class="form-control" required>
                        <label class="form-label">Quantity</label>
                      </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="price" min='0.01' type="number"  step="0.01" class="form-control" required>
                        <label class="form-label">Price</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-12">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="remarks" type="text" class="form-control" required>
                        <label class="form-label">Remarks</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-sm-9"></div>
                <div class="col-sm-3" style="padding-left: 13%">
                  <button type="submit" class="btn bg-green btn-lg m-l-15 waves-effect">CONFIRM</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- #END# Multi Column -->
  </div>
</section>


{% endblock main %}




{% block scripts %}
  <!-- Jquery Core Js -->
  <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>

  <!-- Bootstrap Core Js -->
  <script src="{% static 'plugins/bootstrap/js/bootstrap.js' %}"></script>

  <!-- Select Plugin Js -->
  <script src="{% static 'plugins/bootstrap-select/js/bootstrap-select.js' %}"></script>

  <!-- Slimscroll Plugin Js -->
  <script src="{% static 'plugins/jquery-slimscroll/jquery.slimscroll.js' %}"></script>

  <!-- Waves Effect Plugin Js -->
  <script src="{% static 'plugins/node-waves/waves.js' %}"></script>

  <!-- Autosize Plugin Js -->
  <script src="{% static 'plugins/autosize/autosize.js' %}"></script>

  <!-- Moment Plugin Js -->
  <script src="{% static 'plugins/momentjs/moment.js' %}"></script>

  <!-- Bootstrap Material Datetime Picker Plugin Js -->
  <script src="{% static 'plugins/bootstrap-material-datetimepicker/js/bootstrap-material-datetimepicker.js' %}"></script>

  <!-- Bootstrap Datepicker Plugin Js -->
  <script src="{% static 'plugins/bootstrap-datepicker/js/bootstrap-datepicker.js' %}"></script>

  <!-- Custom Js -->
  <script src="{% static 'js/admin.js' %}"></script>
  <script src="{% static 'js/Alerts.js' %}"></script>
  <script src="{% static 'js/pages/forms/basic-form-elements.js' %}"></script>

  <!-- Demo Js -->
  <script src="{% static 'js/demo.js' %}"></script>

  {% if invalid_details %}
    <script>
      window.onload = function exampleFunction() {incorrect()}
    </script>
  {% endif %}

{% endblock scripts %}
