{% extends 'base.html' %}
{% load static %}


{% block css %}
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=latin,cyrillic-ext" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" type="text/css">

  <!-- Bootstrap Core Css -->
  <link href="{% static 'plugins/bootstrap/css/bootstrap.css' %}" rel="stylesheet">

  <!-- Waves Effect Css -->
  <link href="{% static 'plugins/node-waves/waves.css' %}" rel="stylesheet" />

  <!-- Animation Css -->
  <link href="{% static 'plugins/animate-css/animate.css' %}" rel="stylesheet" />

  <!-- Colorpicker Css -->
  <link href="{% static 'plugins/bootstrap-colorpicker/css/bootstrap-colorpicker.css' %}" rel="stylesheet" />

  <!-- Multi Select Css -->
  <link href="{% static 'plugins/multi-select/css/multi-select.css' %}" rel="stylesheet">

  <!-- Bootstrap Spinner Css -->
  <link href="{% static 'plugins/jquery-spinner/css/bootstrap-spinner.css' %}" rel="stylesheet">

  <!-- Bootstrap Tagsinput Css -->
  <link href="{% static 'plugins/bootstrap-tagsinput/bootstrap-tagsinput.css' %}" rel="stylesheet">

  <!-- Bootstrap Select Css -->
  <link href="{% static 'plugins/bootstrap-select/css/bootstrap-select.css' %}" rel="stylesheet" />

  <!-- noUISlider Css -->
  <link href="{% static 'plugins/nouislider/nouislider.min.css' %}" rel="stylesheet" />

  <!-- Custom Css -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet">

  <!-- AdminBSB Themes. You can choose a theme from css/themes instead of get all themes -->
  <link href="{% static 'css/themes/all-themes.css' %}" rel="stylesheet" />

  <!-- Upload-Box -->
  <link href="{% static 'css/upload_box.css' %}" rel="stylesheet" />

{% endblock css %}


{% block main %}

<section class="content">
  <div class="container-fluid">
    <div class="block-header">
      <h2>EMPLOYEE MANAGEMENT</h2>
    </div>
    <!-- Multi Column -->
    <div class="row clearfix">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="header">
            <h2>
              ADD EMPLOYEE
              {% if invalid_details %}
                <small><b>Invalid Details</b></small>
              {% endif %}
            </h2>
          </div>
          <div class="body">
            <form action="." method="POST" enctype="multipart/form-data"> {% csrf_token %}
              <div class="row clearfix">
                <div class="col-md-8">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="name" type="text" class="form-control" required/>
                      <label class="form-label">Name</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group form-float">
                      <div class="form-line">
                        <input name="age" min='18' type="number"  step="1" class="form-control" required/>
                        <label class="form-label">Age</label>
                      </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-12">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="address" type="text" class="form-control" required/>
                      <label class="form-label"># Address</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="phone" type="text" class="form-control" required/>
                      <label class="form-label">Phone Number</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="mail" type="email" class="form-control" required/>
                      <label class="form-label">Email</label>
                    </div>
                  </div>
                </div>
              </div>
              <label for="referenceone">Reference One</label>
              <div class="row clearfix">
                <div class="col-md-8">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="ref_name1" id="referenceone" type="text" class="form-control" required/>
                      <label class="form-label">Name</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="ref_phone1" type="text" class="form-control" required/>
                      <label class="form-label">Phone Number</label>
                    </div>
                  </div>
                </div>
              </div>
              <label for="referencetwo">Reference Two</label>
              <div class="row clearfix">
                <div class="col-md-8">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="ref_name2" id="referencetwo" type="text" class="form-control" required/>
                      <label class="form-label">Name</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="ref_phone2" type="text" class="form-control" required/>
                      <label class="form-label">Phone Number</label>
                    </div>
                  </div>
                </div>
              </div>
              <label for="">Last Five Year Experience</label>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="at1" id="" type="text" class="form-control" required/>
                      <label class="form-label">At &ensp;[ First Year ]</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="as1" id="" type="text" class="form-control" required/>
                      <label class="form-label">As &ensp;[ First Year ]</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="at2" id="" type="text" class="form-control" required/>
                      <label class="form-label">At &ensp;[ Second Year ]</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="as2" id="" type="text" class="form-control" required/>
                      <label class="form-label">As &ensp;[ Second Year ]</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="at3" id="" type="text" class="form-control" required/>
                      <label class="form-label">At &ensp;[ Third Year ]</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="as3" id="" type="text" class="form-control" required/>
                      <label class="form-label">As &ensp;[ Third Year ]</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="at4" id="" type="text" class="form-control" required/>
                      <label class="form-label">At &ensp;[ Fourth Year ]</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="as4" id="" type="text" class="form-control" required/>
                      <label class="form-label">As &ensp;[ Fourth Year ]</label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row clearfix">
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="at5" id="" type="text" class="form-control" required/>
                      <label class="form-label">At &ensp;[ Fifth Year ]</label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group form-float">
                    <div class="form-line">
                      <input name="as5" id="" type="text" class="form-control" required/>
                      <label class="form-label">As &ensp;[ Fifth Year ]</label>
                    </div>
                  </div>
                </div>
              </div>
              <label for="">JOB PROFILE</label>
              <div class="row clearfix">
                <div class="col-md-12">
                  <select name="job_profile" class="form-control show-tick" required>
                    <option value="">-- Please select --</option>
                    <option value="SM">SM &ensp;[ Store Manager ]</option>
                    <option value="RSO">RSO &ensp;[ Register Sales Officer ]</option>
                    <option value="ISO">ISO &ensp;[ InStore Sales Officer ]</option>
                    <option value="IIC">IIC &ensp;[ InStore Inventory Coordinator ]</option>
                    <option value="IM">IM &ensp;[ Inventory Manager ]</option>
                    <option value="SC">SC &ensp;[ Scan Coordinator ]</option>
                    <option value="MO">MO &ensp;[ Maintenance Officer ]</option>
                    <option value="HK">HK &ensp;[ House Keeping ]</option>
                  </select>
              </div>
              <div class="row clearfix">
                <div class="col-md-9"></div>
                <div class="col-sm-3" style="padding-left: 13%">
                  <button type="submit" class="btn bg-green btn-lg m-l-15 waves-effect">CONFIRM</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- #END# Multi Column -->
  </div>
</section>

{% endblock main %}


{% block scripts %}
  <!-- Jquery Core Js -->
  <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>

  <!-- Bootstrap Core Js -->
  <script src="{% static 'plugins/bootstrap/js/bootstrap.js' %}"></script>

  <!-- Select Plugin Js -->
  <script src="{% static 'plugins/bootstrap-select/js/bootstrap-select.js' %}"></script>

  <!-- Slimscroll Plugin Js -->
  <script src="{% static 'plugins/jquery-slimscroll/jquery.slimscroll.js' %}"></script>

  <!-- Bootstrap Colorpicker Js -->
  <script src="{% static 'plugins/bootstrap-colorpicker/js/bootstrap-colorpicker.js' %}"></script>

  <!-- Input Mask Plugin Js -->
  <script src="{% static 'plugins/jquery-inputmask/jquery.inputmask.bundle.js' %}"></script>

  <!-- Multi Select Plugin Js -->
  <script src="{% static 'plugins/multi-select/js/jquery.multi-select.js' %}"></script>

  <!-- Jquery Spinner Plugin Js -->
  <script src="{% static 'plugins/jquery-spinner/js/jquery.spinner.js' %}"></script>

  <!-- Bootstrap Tags Input Plugin Js -->
  <script src="{% static 'plugins/bootstrap-tagsinput/bootstrap-tagsinput.js' %}"></script>

  <!-- noUISlider Plugin Js -->
  <script src="{% static 'plugins/nouislider/nouislider.js' %}"></script>

  <!-- Waves Effect Plugin Js -->
  <script src="{% static 'plugins/node-waves/waves.js' %}"></script>

  <!-- Custom Js -->
  <script src="{% static 'js/admin.js' %}"></script>
  <script src="{% static 'js/Alerts.js' %}"></script>
  <script src="{% static 'js/pages/forms/advanced-form-elements.js' %}"></script>

  <!-- Demo Js -->
  <script src="{% static 'js/demo.js' %}"></script>

{% endblock scripts %}
